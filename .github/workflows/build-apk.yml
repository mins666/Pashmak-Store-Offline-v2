name: Build Pashmak Store v4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          echo "Searching for Pashmak project ZIP..."

          mapfile -t ZIPS < <(
            find . -type f -iname "*.zip" \
            ! -path "./.git/*"
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found."
            find . -maxdepth 4 -type f | sort
            exit 1
          fi

          echo "ZIP files found:"
          printf '%s\n' "${ZIPS[@]}"

          ZIP_FILE="${ZIPS[0]}"

          echo "Using:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          echo "Testing ZIP integrity..."

          unzip -t "$ZIP_FILE"

          echo "ZIP integrity OK."

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Project extracted."

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          FOUND=$(find project -type f \
            -name "settings.gradle" \
            | head -n 1)

          if [ -z "$FOUND" ]; then
            echo "ERROR: settings.gradle not found."
            find project -maxdepth 6 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$PROJECT_DIR"

      - name: Check project files
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/java/com/pashmak/store/MainActivity.java"

          echo "All required project files exist."

      - name: Verify Pashmak package and version
        shell: bash
        run: |
          set -e

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          grep -q "applicationId 'com.pashmak.store.v4test'" "$APP_GRADLE"
          grep -q "versionCode 400" "$APP_GRADLE"
          grep -q "versionName '4.0.0-test'" "$APP_GRADLE"
          grep -q "compileSdk 35" "$APP_GRADLE"
          grep -q "com.android.application.*8.5.2" "$PROJECT_DIR/build.gradle"

          echo "Package and Android build configuration verified."

      - name: Verify application data code
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          test -s "$INDEX"

          grep -q "store_full_v2" "$INDEX"
          grep -q "localStorage" "$INDEX"
          grep -q "sales" "$INDEX"

          echo "Pashmak application data code verified."

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            FOUND_SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager \
              | head -n 1)

            if [ -n "$FOUND_SDKMANAGER" ]; then
              SDKMANAGER="$FOUND_SDKMANAGER"
            fi
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "Using sdkmanager:"
          echo "$SDKMANAGER"

          yes | "$SDKMANAGER" --licenses > /dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK 35 is ready."

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find generated APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo "Generated APK:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Pashmak-Store-v4-unsigned.apk"

      - name: Generate new signing key
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/pashmak-v4.keystore" \
            -alias pashmakv4 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pashmak123 \
            -keypass pashmak123 \
            -dname "CN=Pashmak Store, OU=Pashmak, O=Pashmak, L=Tehran, ST=Tehran, C=IR"

          echo "New signing key generated."

      - name: Align APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -x "$BUILD_TOOLS/zipalign"

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            Pashmak-Store-v4-unsigned.apk \
            Pashmak-Store-v4-aligned.apk

          echo "APK aligned."

      - name: Sign APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -x "$BUILD_TOOLS/apksigner"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/pashmak-v4.keystore" \
            --ks-key-alias pashmakv4 \
            --ks-pass pass:pashmak123 \
            --key-pass pass:pashmak123 \
            --out Pashmak-Store-v4.apk \
            Pashmak-Store-v4-aligned.apk

          echo "APK signed."

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Pashmak-Store-v4.apk

          echo "APK signature verified successfully."

      - name: Verify APK package
        shell: bash
        run: |
          set -e

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          BADGING=$(
            "$BUILD_TOOLS/aapt" dump badging \
            Pashmak-Store-v4.apk
          )

          echo "$BADGING"

          echo "$BADGING" | grep -q \
            "package: name='com.pashmak.store.v4test'"

          echo "$BADGING" | grep -q \
            "versionCode='400'"

          echo "$BADGING" | grep -q \
            "versionName='4.0.0-test'"

          echo "APK package information verified."

      - name: Show final APK
        shell: bash
        run: |
          set -e

          echo "FINAL APK:"
          ls -lh Pashmak-Store-v4.apk

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Pashmak-Store-v4-FINAL
          path: Pashmak-Store-v4.apk
          if-no-files-found: error
