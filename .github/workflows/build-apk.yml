name: Build Pashmak Store v4

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find project ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name 'Pashmak_Store_v4_Final_2026-09-19_FIXED.zip' | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Pashmak v4 ZIP not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Verify ZIP
        shell: bash
        run: |
          set -e

          EXPECTED="d781aa07cba22e520c175d652c32eb336781e3799a27c666c8de0b87b80c6337"
          ACTUAL=$(sha256sum "$ZIP_FILE" | awk '{print $1}')

          echo "Expected SHA256: $EXPECTED"
          echo "Actual SHA256:   $ACTUAL"

          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "ERROR: ZIP checksum does not match."
            exit 1
          fi

          echo "ZIP checksum OK."

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf project
          mkdir -p project

          unzip -q "$ZIP_FILE" -d project

          echo "Extracted project:"
          find project -maxdepth 4 -type f | sort | head -200

      - name: Locate Android project
        shell: bash
        run: |
          set -e

          if [ -f "project/settings.gradle" ] || [ -f "project/settings.gradle.kts" ]; then
            echo "PROJECT_DIR=project" >> "$GITHUB_ENV"
            exit 0
          fi

          FOUND=$(find project -type f \( -name "settings.gradle" -o -name "settings.gradle.kts" \) | head -n 1)

          if [ -z "$FOUND" ]; then
            echo "ERROR: Android Gradle project not found."
            exit 1
          fi

          DIR=$(dirname "$FOUND")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Check required files
        shell: bash
        run: |
          set -e

          test -f "$PROJECT_DIR/app/src/main/assets/index.html"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          echo "Required Android project files found."

      - name: Check Pashmak features
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          echo "Checking application features..."

          grep -q "store_full_v2" "$INDEX"
          grep -q "sales" "$INDEX"
          grep -q "void" "$INDEX"
          grep -q "report" "$INDEX"

          echo "Core Pashmak data/report code found."

      - name: Set package and version
        shell: bash
        run: |
          set -e

          echo "Changing package to:"
          echo "com.pashmak.store.v4test"

          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" -o -name "AndroidManifest.xml" -o -name "*.java" \) \
            -print0 | xargs -0 sed -i \
            -e 's/com\.pashmak\.store\.v3test/com.pashmak.store.v4test/g' \
            -e 's/com\.pashmak\.store/com.pashmak.store.v4test/g'

          find "$PROJECT_DIR" -type f \( -name "*.gradle" -o -name "*.gradle.kts" \) \
            -print0 | xargs -0 sed -i \
            -e 's/versionCode[[:space:]]*[0-9]*/versionCode 400/g' \
            -e 's/versionName[[:space:]]*["'\''][^"'\'']*["'\'']/versionName "4.0.0-test"/g'

          echo "Package/version update completed."

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$PROJECT_DIR/gradlew"

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -e

          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          cp "$APK" "$GITHUB_WORKSPACE/Pashmak-Store-v4.apk"

      - name: Generate new signing key
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/pashmak-v4.keystore" \
            -alias pashmakv4 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pashmak123 \
            -keypass pashmak123 \
            -dname "CN=Pashmak Store, OU=Pashmak, O=Pashmak, L=Tehran, ST=Tehran, C=IR"

      - name: Sign APK
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            Pashmak-Store-v4.apk \
            Pashmak-Store-v4-aligned.apk

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/pashmak-v4.keystore" \
            --ks-key-alias pashmakv4 \
            --ks-pass pass:pashmak123 \
            --key-pass pass:pashmak123 \
            --out Pashmak-Store-v4-signed.apk \
            Pashmak-Store-v4-aligned.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          "$BUILD_TOOLS/apksigner" verify --verbose Pashmak-Store-v4-signed.apk

          echo "APK signature verified successfully."

      - name: Show APK information
        shell: bash
        run: |
          set -e

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME/build-tools/"* | sort -V | tail -n 1)

          "$BUILD_TOOLS/aapt" dump badging Pashmak-Store-v4-signed.apk | head -n 5

          echo "Final APK:"
          ls -lh Pashmak-Store-v4-signed.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pashmak-Store-v4-FINAL
          path: Pashmak-Store-v4-signed.apk
          if-no-files-found: error
      - name: Verify exact ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./Pashmak_Store_v3_Test_InvoiceEdit_2026-09-19.zip"
          EXPECTED_SHA="3ed588f52b4b5bc1d2ffa950242d7eda17b17241c432952c4c8f8959ef95003d"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          ACTUAL_SHA="$(sha256sum "$ZIP_FILE" | awk '{print $1}')"

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: ZIP SHA mismatch."
            exit 1
          fi

          echo "ZIP verified."

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf pashmak_project
          mkdir -p pashmak_project

          unzip -q "./Pashmak_Store_v3_Test_InvoiceEdit_2026-09-19.zip" -d pashmak_project

          SETTINGS_FILE="$(find pashmak_project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Verify required changes
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "window.editInvoice" "$INDEX"
          grep -q "window.voidInvoice" "$INDEX"
          grep -q "groupedInvoices" "$INDEX"

          echo "Invoice edit and void code verified."

      - name: Set new Package ID and version
        shell: bash
        run: |
          set -e

          BUILD="$PROJECT_DIR/app/build.gradle"

          sed -i -E 's/applicationId[[:space:]]+["'\''][^"'\'']+["'\'']/applicationId "com.pashmak.store.v4test"/' "$BUILD"
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 400/' "$BUILD"
          sed -i -E 's/versionName[[:space:]]+["'\''][^"'\'']+["'\'']/versionName "4.0.0-test"/' "$BUILD"

          echo "Final configuration:"
          grep -E "applicationId|versionCode|versionName" "$BUILD"

      - name: Create new signing key
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/pashmak-v4test.jks" \
            -alias pashmak-v4test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pashmakv4 \
            -keypass pashmakv4 \
            -dname "CN=Pashmak Store v4 Test, OU=Pashmak, O=Pashmak Store, C=IR"

          echo "New signing key created."

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Sign APK with new key
        shell: bash
        run: |
          set -e

          UNSIGNED="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="$PROJECT_DIR/app/build/outputs/apk/debug/app-aligned.apk"
          FINAL="$PROJECT_DIR/app/build/outputs/apk/debug/Pashmak-Store-v4.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -f 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$PROJECT_DIR/pashmak-v4test.jks" \
            --ks-pass pass:pashmakv4 \
            --key-pass pass:pashmakv4 \
            --ks-key-alias pashmak-v4test \
            --out "$FINAL" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose "$FINAL"

          echo "SIGNED APK:"
          ls -lh "$FINAL"

          echo "APK SHA-256:"
          sha256sum "$FINAL"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Pashmak-Store-v4-InvoiceEdit-Signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/Pashmak-Store-v4.apk
          if-no-files-found: error
