name: Build Pashmak Store v4

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.7
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q gradle-8.7-bin.zip
          echo "$PWD/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Verify exact ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE="./Pashmak_Store_v3_Test_InvoiceEdit_2026-09-19.zip"
          EXPECTED_SHA="3ed588f52b4b5bc1d2ffa950242d7eda17b17241c432952c4c8f8959ef95003d"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found."
            exit 1
          fi

          ACTUAL_SHA="$(sha256sum "$ZIP_FILE" | awk '{print $1}')"

          echo "Expected SHA: $EXPECTED_SHA"
          echo "Actual SHA:   $ACTUAL_SHA"

          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "ERROR: ZIP SHA mismatch."
            exit 1
          fi

          echo "ZIP verified."

      - name: Extract project
        shell: bash
        run: |
          set -e

          rm -rf pashmak_project
          mkdir -p pashmak_project

          unzip -q "./Pashmak_Store_v3_Test_InvoiceEdit_2026-09-19.zip" -d pashmak_project

          SETTINGS_FILE="$(find pashmak_project -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Project: $PROJECT_DIR"

      - name: Verify required changes
        shell: bash
        run: |
          set -e

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          grep -q "window.editInvoice" "$INDEX"
          grep -q "window.voidInvoice" "$INDEX"
          grep -q "groupedInvoices" "$INDEX"

          echo "Invoice edit and void code verified."

      - name: Set new Package ID and version
        shell: bash
        run: |
          set -e

          BUILD="$PROJECT_DIR/app/build.gradle"

          sed -i -E 's/applicationId[[:space:]]+["'\''][^"'\'']+["'\'']/applicationId "com.pashmak.store.v4test"/' "$BUILD"
          sed -i -E 's/versionCode[[:space:]]+[0-9]+/versionCode 400/' "$BUILD"
          sed -i -E 's/versionName[[:space:]]+["'\''][^"'\'']+["'\'']/versionName "4.0.0-test"/' "$BUILD"

          echo "Final configuration:"
          grep -E "applicationId|versionCode|versionName" "$BUILD"

      - name: Create new signing key
        shell: bash
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore "$PROJECT_DIR/pashmak-v4test.jks" \
            -alias pashmak-v4test \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pashmakv4 \
            -keypass pashmakv4 \
            -dname "CN=Pashmak Store v4 Test, OU=Pashmak, O=Pashmak Store, C=IR"

          echo "New signing key created."

      - name: Build APK
        run: |
          gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Sign APK with new key
        shell: bash
        run: |
          set -e

          UNSIGNED="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          ALIGNED="$PROJECT_DIR/app/build/outputs/apk/debug/app-aligned.apk"
          FINAL="$PROJECT_DIR/app/build/outputs/apk/debug/Pashmak-Store-v4.apk"

          ZIPALIGN="$ANDROID_HOME/build-tools/35.0.0/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"

          "$ZIPALIGN" -f 4 "$UNSIGNED" "$ALIGNED"

          "$APKSIGNER" sign \
            --ks "$PROJECT_DIR/pashmak-v4test.jks" \
            --ks-pass pass:pashmakv4 \
            --key-pass pass:pashmakv4 \
            --ks-key-alias pashmak-v4test \
            --out "$FINAL" \
            "$ALIGNED"

          "$APKSIGNER" verify --verbose "$FINAL"

          echo "SIGNED APK:"
          ls -lh "$FINAL"

          echo "APK SHA-256:"
          sha256sum "$FINAL"

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: Pashmak-Store-v4-InvoiceEdit-Signed
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/Pashmak-Store-v4.apk
          if-no-files-found: error
