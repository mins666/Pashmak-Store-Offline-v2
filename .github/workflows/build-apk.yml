name: Build Pashmak Store v5

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Find Pashmak v5 ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find . -type f -iname 'Pashmak_Store_v5_Final_2026-09-19*.zip' ! -path './.git/*' | sort)

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: Pashmak v5 ZIP not found."
            find . -maxdepth 5 -type f | sort
            exit 1
          fi

          if [ "${#ZIPS[@]}" -gt 1 ]; then
            echo "ERROR: More than one Pashmak v5 ZIP found:"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          ZIP_FILE="${ZIPS[0]}"
          echo "Using ZIP: $ZIP_FILE"
          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Verify ZIP integrity
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$ZIP_FILE" >/dev/null
          echo "ZIP integrity OK."

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find project -type f -name settings.gradle | sort | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Verify project
        shell: bash
        run: |
          set -euo pipefail

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle"
          MANIFEST="$PROJECT_DIR/app/src/main/AndroidManifest.xml"

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$APP_GRADLE"
          test -f "$MANIFEST"
          test -f "$INDEX"

          grep -Fq "namespace 'com.pashmak.store.v5test'" "$APP_GRADLE"
          grep -Fq "applicationId 'com.pashmak.store.v5test'" "$APP_GRADLE"
          grep -Fq "versionCode 500" "$APP_GRADLE"
          grep -Fq "versionName '5.0.0-test'" "$APP_GRADLE"
          grep -Fq "compileSdk 35" "$APP_GRADLE"

          grep -Fq "store_full_v2" "$INDEX"
          grep -Fq "window.openInitialInventory=function" "$INDEX"
          grep -Fq "window.applyInitialInventoryUI=function" "$INDEX"
          grep -Fq "window.editInvoice=function" "$INDEX"
          grep -Fq "window.voidInvoice=function" "$INDEX"
          grep -Fq "window.openCategory=function" "$INDEX"
          grep -Fq "window.showInventoryCategory=function" "$INDEX"

          echo "Project verification OK."

      - name: Check JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          node - "$INDEX" <<'NODE'
          const fs = require("fs");
          const vm = require("vm");

          const file = process.argv[2];
          const html = fs.readFileSync(file, "utf8");

          const scripts = [
            ...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)
          ];

          if (!scripts.length) {
            throw new Error("No script blocks found.");
          }

          scripts.forEach((m, i) => {
            new vm.Script(m[1], {
              filename: `index-script-${i}.js`
            });
          });

          console.log(`Checked ${scripts.length} JavaScript blocks.`);
          NODE

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=""

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f -name sdkmanager | sort | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

          echo "Android SDK ready."

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          gradle clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name "*.apk" | sort | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Pashmak-Store-v5-unsigned.apk"

      - name: Generate signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pashmak-v5.keystore" \
            -alias pashmakv5 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pashmak123 \
            -keypass pashmak123 \
            -dname "CN=Pashmak Store, OU=Pashmak, O=Pashmak, L=Tehran, ST=Tehran, C=IR"

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" -f 4 \
            Pashmak-Store-v5-unsigned.apk \
            Pashmak-Store-v5-aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/pashmak-v5.keystore" \
            --ks-key-alias pashmakv5 \
            --ks-pass pass:pashmak123 \
            --key-pass pass:pashmak123 \
            --out Pashmak-Store-v5.apk \
            Pashmak-Store-v5-aligned.apk

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify --verbose Pashmak-Store-v5.apk

          BADGING=$("$BUILD_TOOLS/aapt" dump badging Pashmak-Store-v5.apk)

          echo "$BADGING"

          echo "$BADGING" | grep -Fq "package: name='com.pashmak.store.v5test'"
          echo "$BADGING" | grep -Fq "versionCode='500'"
          echo "$BADGING" | grep -Fq "versionName='5.0.0-test'"

          echo "Final APK verified."

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Pashmak-Store-v5-FINAL
          path: Pashmak-Store-v5.apk
          if-no-files-found: error
      - name: Verify ZIP
        shell: bash
        run: |
          set -euo pipefail
          unzip -t "$ZIP_FILE" >/dev/null
          echo 'ZIP integrity OK.'

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail
          rm -rf project
          mkdir -p project
          unzip -q "$ZIP_FILE" -d project
          echo 'Project extracted.'

      - name: Locate Android project
        shell: bash
        run: |
          set -euo pipefail

          FOUND=$(find project -type f -name 'settings.gradle' | sort | head -n 1)

          if [ -z "$FOUND" ]; then
            echo 'ERROR: settings.gradle not found.'
            find project -maxdepth 8 -type f | sort
            exit 1
          fi

          PROJECT_DIR=$(dirname "$FOUND")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Check project files
        shell: bash
        run: |
          set -euo pipefail

          test -f "$PROJECT_DIR/settings.gradle"
          test -f "$PROJECT_DIR/build.gradle"
          test -f "$PROJECT_DIR/app/build.gradle"
          test -f "$PROJECT_DIR/app/src/main/AndroidManifest.xml"
          test -f "$PROJECT_DIR/app/src/main/assets/index.html"

          MAIN_ACTIVITY=$(find "$PROJECT_DIR/app/src/main/java" -type f -name 'MainActivity.java' | sort | head -n 1)

          if [ -z "$MAIN_ACTIVITY" ]; then
            echo 'ERROR: MainActivity.java not found.'
            find "$PROJECT_DIR/app/src/main/java" -type f | sort
            exit 1
          fi

          echo "MainActivity: $MAIN_ACTIVITY"
          echo "MAIN_ACTIVITY=$MAIN_ACTIVITY" >> "$GITHUB_ENV"

          echo 'Required project files verified.'

      - name: Verify package and version
        shell: bash
        run: |
          set -euo pipefail

          APP_GRADLE="$PROJECT_DIR/app/build.gradle"

          grep -Fq "applicationId 'com.pashmak.store.v5test'" "$APP_GRADLE"
          grep -Fq "namespace 'com.pashmak.store.v5test'" "$APP_GRADLE"
          grep -Fq 'versionCode 500' "$APP_GRADLE"
          grep -Fq "versionName '5.0.0-test'" "$APP_GRADLE"
          grep -Fq 'compileSdk 35' "$APP_GRADLE"
          grep -Fq "package com.pashmak.store.v5test;" "$MAIN_ACTIVITY"

          echo 'Package, namespace, version and MainActivity package verified.'

      - name: Verify Pashmak application
        shell: bash
        run: |
          set -euo pipefail

          INDEX="$PROJECT_DIR/app/src/main/assets/index.html"

          test -s "$INDEX"
          grep -Fq 'store_full_v2' "$INDEX"
          grep -Fq 'localStorage' "$INDEX"
          grep -Fq 'sales' "$INDEX"
          grep -Fq 'voided' "$INDEX"
          grep -Fq 'editInvoice' "$INDEX"
          grep -Fq 'reportInventory' "$INDEX"

          echo 'Pashmak application checks passed.'

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare Android SDK 35
        shell: bash
        run: |
          set -euo pipefail

          SDKMANAGER=''

          if command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          elif [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort | head -n 1 || true)
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo 'ERROR: sdkmanager not found.'
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

          test -d "$ANDROID_HOME/platforms/android-35"
          test -x "$ANDROID_HOME/build-tools/35.0.0/zipalign"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt"

          echo 'Android SDK 35 verified.'

      - name: Build debug APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Find APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find "$PROJECT_DIR/app/build/outputs/apk/debug" \
            -type f -name '*.apk' | sort | head -n 1)

          if [ -z "$APK" ]; then
            echo 'ERROR: APK was not generated.'
            find "$PROJECT_DIR/app/build/outputs" \
              -type f 2>/dev/null | sort || true
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/Pashmak-Store-v5-unsigned.apk"

          echo "APK: $APK"

      - name: Generate new signing key
        shell: bash
        run: |
          set -euo pipefail

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/pashmak-v5.keystore" \
            -alias pashmakv5 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass pashmak123 \
            -keypass pashmak123 \
            -dname 'CN=Pashmak Store, OU=Pashmak, O=Pashmak, L=Tehran, ST=Tehran, C=IR'

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/zipalign" \
            -f 4 \
            Pashmak-Store-v5-unsigned.apk \
            Pashmak-Store-v5-aligned.apk

      - name: Sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/pashmak-v5.keystore" \
            --ks-key-alias pashmakv5 \
            --ks-pass pass:pashmak123 \
            --key-pass pass:pashmak123 \
            --out Pashmak-Store-v5.apk \
            Pashmak-Store-v5-aligned.apk

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            Pashmak-Store-v5.apk

          BADGING=$("$BUILD_TOOLS/aapt" dump badging Pashmak-Store-v5.apk)

          echo "$BADGING"

          echo "$BADGING" | grep -Fq \
            "package: name='com.pashmak.store.v5test'"

          echo "$BADGING" | grep -Fq \
            "versionCode='500'"

          echo "$BADGING" | grep -Fq \
            "versionName='5.0.0-test'"

          echo 'Final APK signature and package verified.'

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: Pashmak-Store-v5-FINAL
          path: Pashmak-Store-v5.apk
          if-no-files-found: error
